<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Petualangan Rantai Makanan</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#e8f8d8;--card:#fff;--ink:#2b3a1f;--g:#4caf50;--y:#ffc83d;--o:#ff8a3d;--b:#3db7ff;--p:#e86bb0;--bad:#ff6b5e}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b2a17;--card:#2a3d24;--ink:#f1f7e6}}
:root[data-theme="dark"]{--bg:#1b2a17;--card:#2a3d24;--ink:#f1f7e6}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Baloo 2","Comic Sans MS","Trebuchet MS",system-ui,sans-serif;font-size:18px;min-height:100vh}
.top{display:flex;gap:6px;justify-content:center;padding:10px}
.dot{width:14px;height:14px;border-radius:50%;background:#0003}.dot.on{background:var(--o);transform:scale(1.3)}
.wrap{max-width:720px;margin:0 auto;padding:8px 14px 90px}
.card{background:var(--card);border:4px solid var(--g);border-radius:28px;padding:20px;box-shadow:0 8px 0 #0002;animation:pop .5s}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
@keyframes bob{50%{transform:translateY(-12px)}}@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
h1{font-size:2rem;margin:.2em 0;color:var(--o)}h2{font-size:1.5rem;margin:.2em 0;color:var(--g)}
.big{font-size:3rem;text-align:center}.bob{display:inline-block;animation:bob 1.6s infinite}.bob:nth-child(2){animation-delay:.3s}.bob:nth-child(3){animation-delay:.6s}.bob:nth-child(4){animation-delay:.9s}
.c{text-align:center}
button,.btn{font:inherit;font-weight:700;border:0;border-radius:20px;padding:12px 20px;background:var(--y);color:#3a2a00;box-shadow:0 5px 0 #0003;cursor:pointer;margin:4px}
button:active{transform:translateY(4px);box-shadow:none}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg)}
.nav button{background:var(--b);color:#fff}
input[type=text]{font:inherit;padding:10px 14px;border-radius:16px;border:3px solid var(--b);width:100%;margin:5px 0;background:var(--card);color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{background:var(--bg);border:3px solid var(--b);border-radius:20px;padding:10px 14px;text-align:center;cursor:pointer;min-width:90px}
.chip span{display:block;font-size:2.2rem}
.chip.used{opacity:.3;pointer-events:none}.chip.bad{animation:shake .4s;border-color:var(--bad)}
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:4px;min-height:80px;background:var(--bg);border:3px dashed var(--o);border-radius:20px;padding:8px;margin:10px 0}
.link{background:var(--y);color:#3a2a00;border-radius:16px;padding:6px 10px;text-align:center;animation:pop .4s}.link span{display:block;font-size:2rem}
.t{background:var(--bg);border-left:8px solid var(--g);border-radius:14px;padding:10px;margin:8px 0;cursor:pointer}
.t b{color:var(--o)}.hide{display:none}
.q{font-size:1.4rem;text-align:center;margin:8px 0}
.opt{display:block;width:100%;text-align:left;background:var(--bg);color:var(--ink);border:3px solid var(--b)}
.fb{text-align:center;font-size:1.6rem;font-weight:800;margin:10px 0;animation:pop .4s}.ok{color:var(--g)}.no{color:var(--bad)}
.bar{height:16px;background:#0002;border-radius:10px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g);transition:width .4s}
.stars{font-size:2.6rem}
</style></head><body>
<div class="top" id="dots"></div>
<div class="wrap" id="app"></div>
<div class="nav"><button id="prev">◀ Kembali</button><button id="next">Lanjut ▶</button></div>
<script>
const E={Rumput:"🌿",Daun:"🍃",Padi:"🌾",Wortel:"🥕",Jagung:"🌽",Plankton:"🦠","Nektar bunga":"🌸",Belalang:"🦗",Katak:"🐸",Ular:"🐍",Tikus:"🐭",Zebra:"🦓",Rusa:"🦌","Ikan kecil":"🐟",Ulat:"🐛",Lalat:"🪰"};
const Q=[["Belalang","🦗","Rumput"],["Ulat","🐛","Daun"],["Tikus","🐭","Padi"],["Kelinci","🐰","Wortel"],["Sapi","🐄","Rumput"],["Ayam","🐔","Jagung"],["Burung pipit","🐦","Ulat"],["Katak","🐸","Belalang"],["Ular","🐍","Katak"],["Elang","🦅","Ular"],["Burung hantu","🦉","Tikus"],["Kucing","🐱","Tikus"],["Singa","🦁","Zebra"],["Zebra","🦓","Rumput"],["Harimau","🐯","Rusa"],["Rusa","🦌","Daun"],["Ikan kecil","🐟","Plankton"],["Ikan besar","🐠","Ikan kecil"],["Laba-laba","🕷️","Lalat"],["Kupu-kupu","🦋","Nektar bunga"]];
const PL=["Rumput","Daun","Padi","Wortel","Jagung","Plankton","Nektar bunga"],AN=["Belalang","Katak","Ular","Tikus","Ikan kecil","Ulat","Lalat"];
const CH=[[["Rumput","🌿"],["Belalang","🦗"],["Katak","🐸"],["Ular","🐍"],["Elang","🦅"]],[["Padi","🌾"],["Tikus","🐭"],["Ular","🐍"],["Elang","🦅"]],[["Plankton","🦠"],["Ikan kecil","🐟"],["Ikan besar","🐠"],["Beruang","🐻"]],[["Daun","🍃"],["Ulat","🐛"],["Burung pipit","🐦"],["Elang","🦅"]],[["Rumput","🌿"],["Zebra","🦓"],["Singa","🦁"],["Jamur","🍄"]]];
function bp(f){try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.frequency.value=f;g.gain.value=.1;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.15)}catch(e){}}
const sh=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
let s=0,name="",qi=0,score=0,qs=[],ci=0,pos=0,done=[false,false,false],answered=false;
const $=id=>document.getElementById(id),app=$("app");
function mk(){qs=sh(Q).map(([e,em,f])=>{const pool=PL.includes(f)?AN:PL;const d=sh(pool.filter(x=>x!==f&&x!==e)).slice(0,2);return{e,em,f,o:sh([f,...d])}})}
function dots(){$("dots").innerHTML=[0,1,2,3,4,5].map(i=>`<div class="dot ${i==s?"on":""}"></div>`).join("");$("prev").style.visibility=s?"visible":"hidden";$("next").style.visibility=s<5&&s!=4?"visible":"hidden"}
function go(n){s=n;dots();draw();scrollTo(0,0)}
$("prev").onclick=()=>go(s-1);$("next").onclick=()=>go(s+1);
function draw(){[open,goal,materi,act,quiz,end][s]()}
function open(){app.innerHTML=`<div class="card c"><div class="big"><span class="bob">🌿</span><span class="bob">🐛</span><span class="bob">🐸</span><span class="bob">🦅</span></div>
<h1>Petualangan Rantai Makanan</h1><p>Media Interaktif IPAS • Kelas 5</p><p>Halo, teman-teman hebat! Siapa namamu?</p>
<input type="text" id="nm" placeholder="Tulis namamu di sini" value="${name}"><button onclick="name=$('nm').value.trim();go(1)">Mulai Petualangan! 🚀</button></div>`}
function goal(){app.innerHTML=`<div class="card"><h2>🎯 Tujuan Belajar</h2><p>Hai ${name||"teman"}! Hari ini kamu akan petualangan seru. Setelah ini, kamu bisa:</p>
<div class="t"><b>⭐ Membuat urutan rantai makanan</b> dari tumbuhan sampai hewan pemangsa.</div>
<div class="t">🔍 Mengenali <b>produsen</b> dan <b>konsumen</b>.</div><div class="t">🏆 Menjawab 20 tantangan mencocokkan siapa makan apa.</div></div>`}
function materi(){app.innerHTML=`<div class="card"><h2>📖 Yuk, Kenalan!</h2><p>Rantai makanan itu urutan makan-dimakan. Panahnya <b>➡️</b> artinya "dimakan oleh". Ketuk kartu untuk membukanya!</p>
${[["🌿","Produsen","Tumbuhan membuat makanannya sendiri dengan bantuan sinar matahari ☀️. Awal rantai makanan!"],["🦗","Konsumen tingkat 1","Hewan pemakan tumbuhan (herbivora), contoh: belalang, sapi, kelinci."],["🐸","Konsumen tingkat 2","Hewan pemakan hewan lain (karnivora), contoh: katak makan belalang."],["🦅","Konsumen puncak","Pemangsa di ujung rantai, contoh: elang makan ular."],["🍄","Pengurai","Jamur dan bakteri menguraikan hewan atau tumbuhan yang mati menjadi tanah subur. Mereka sering ada di ujung rantai!"]].map(x=>`<div class="t" onclick="this.querySelector('p').classList.toggle('hide')"><span style="font-size:2rem">${x[0]}</span> <b>${x[1]}</b><p class="hide">${x[2]}</p></div>`).join("")}
<div class="c"><div class="big">🌿➡️🦗➡️🐸➡️🐍➡️🦅</div><p>Contoh rantai makanan di sawah. Hebat, kan?</p></div></div>`}
function act(){const c=CH[ci];const sel=c.slice(0,pos);
app.innerHTML=`<div class="card"><h2>🧩 Susun Rantai Makanan (${ci+1}/${CH.length})</h2><p>Ketuk kartu sesuai urutan, mulai dari <b>tumbuhan</b>!</p>
<div class="chain">${sel.map((x,i)=>`${i?"➡️":""}<div class="link"><span>${x[1]}</span>${x[0]}</div>`).join("")||"<i>Rantaimu masih kosong…</i>"}</div>
<div class="row" id="cards">${sh(c).map(x=>`<div class="chip ${sel.includes(x)?"used":""}" onclick="pick(this,'${x[0]}')"><span>${x[1]}</span>${x[0]}</div>`).join("")}</div>
${pos==c.length?`<div class="fb ok">Luar biasa! 🎉 Rantaimu benar!</div><div class="c">${ci<CH.length-1?`<button onclick="ci++;pos=0;act()">Rantai berikutnya ▶</button>`:`<button onclick="go(4)">Ke Kuis 🏆</button>`}</div>`:""}</div>`}
function pick(el,n){if(CH[ci][pos][0]==n){bp(660);pos++;act()}else{bp(200);el.classList.add("bad");setTimeout(()=>el.classList.remove("bad"),450)}}
function quiz(){if(!qs.length)mk();
if(qi>=20)return go(5);const q=qs[qi];answered=false;
app.innerHTML=`<div class="card"><div class="bar"><i style="width:${qi*5}%"></i></div><p class="c">Soal ${qi+1} dari 20 • Skor ${score}</p>
<div class="q"><span style="font-size:3.5rem" class="bob">${q.em}</span><br>Pasangkan: <b>${q.e}</b> memakan …?</div>
${q.o.map(o=>`<button class="opt" onclick="ans(this,'${o}')">${E[o]} ${o}</button>`).join("")}<div id="fb"></div></div>`}
function ans(b,o){if(answered)return;answered=true;const q=qs[qi],r=o==q.f;if(r)score++;bp(r?880:200);
b.style.background=r?"#8fe388":"#ffb3ab";b.style.color="#222";
$("fb").innerHTML=r?`<div class="fb ok">Luar biasa! 🎉⭐</div>`:`<div class="fb no">Belajar lagi 📚</div><p class="c">Jawaban benar: ${q.e} ➡️ ${E[q.f]} <b>${q.f}</b></p>`;
$("fb").innerHTML+=`<div class="c"><button onclick="qi++;quiz()">${qi==19?"Lihat Hasil 🏁":"Soal berikutnya ▶"}</button></div>`}
function end(){const st=score>=17?"🌟🌟🌟":score>=12?"🌟🌟":"🌟";
app.innerHTML=`<div class="card c"><h2>🏁 Hasil Petualanganmu</h2><div class="stars">${st}</div><h1>${score} / 20</h1>
<div class="fb ${score>=12?"ok":"no"}">${score>=12?"Luar biasa, "+(name||"teman")+"! 🎉":"Belajar lagi ya, "+(name||"teman")+" 📚"}</div>
<p>${score>=17?"Kamu jagoan rantai makanan!":score>=12?"Sedikit lagi jadi jagoan!":"Jangan menyerah, ayo ulangi materinya."}</p>
<h2>💭 Refleksi</h2><p>Bagian mana yang paling kamu pahami?</p>
<div class="row">${["Produsen 🌿","Konsumen 🐸","Urutan panah ➡️"].map(x=>`<button onclick="this.style.background='#8fe388';$('rf').innerHTML='Keren! Ceritakan ke temanmu ya 😊'">${x}</button>`).join("")}</div>
<p id="rf">Ketuk salah satu!</p>
<p>Tantangan: buat rantai makanan dari hewan di sekitar rumahmu!</p>
<button onclick="qi=0;score=0;qs=[];ci=0;pos=0;go(0)">Main lagi 🔄</button><button onclick="qi=0;score=0;qs=[];go(4)" style="background:var(--b);color:#fff">Ulangi kuis</button></div>`}
go(0);
</script></body></html>
